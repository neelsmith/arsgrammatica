[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsgrammatica"
version = "0.5.0"
description = "A DSPy-based analyzer of Latin syntax, using an alternative scheme to Universal Dependencies designed for research and teaching."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Neel Smith", email = "nsmith@holycross.edu" },
]
dependencies = [
    "dspy>=3.0",
    "pydantic>=2.0",
    "networkx>=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
# Needed only for arsgrammatica.attgraph() (aat_bridge.py), converting an
# arsgrammatica analysis to an Agent-Action-Target graph. Not on PyPI, so
# this is a direct-URL dependency -- fine for pip, but means this extra
# alone (unlike the base package) won't install from an index mirror that
# rejects those.
aat = ["aat @ git+https://github.com/neelsmith/aat.git"]

# Tooling used to develop arsgrammatica itself -- running the test suite,
# .env-based live-LM config, regenerating docs/arsgrammatica-api-docs.html,
# and the notebooks in marimo/. None of this is needed to just use the
# package (see notes/install.md); `pip install -e ".[dev]"` from a checkout
# covers it in one shot. Combine with `aat` too if you're touching
# aat_bridge.py or its tests: `pip install -e ".[dev,aat]"`.
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "pdoc>=15.0",
    "marimo>=0.20",
]

[project.urls]
Homepage = "https://github.com/neelsmith/arsgrammatica"
Repository = "https://github.com/neelsmith/arsgrammatica"
Issues = "https://github.com/neelsmith/arsgrammatica/issues"

[tool.setuptools.packages.find]
include = ["arsgrammatica*"]
