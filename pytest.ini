[pytest]
# Makes "import arsgrammatica" and "from fixtures.gold_examples import ..."
# work when running plain `pytest` from the repo root, without needing an
# installed package or a root-level conftest.py trick.
pythonpath = .

markers =
    live: exercises the real configured LM instead of DummyLM (skipped by default; run with -m live)
    network: hits a real external network resource instead of a local/mocked fixture (skipped by default; run with -m network)

# Offline/DummyLM tests run by default; opt into live-model tests with
# `pytest -m live`, and tests that need real network access with
# `pytest -m network`.
addopts = -m "not live and not network"
